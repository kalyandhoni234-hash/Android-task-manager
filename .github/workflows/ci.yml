name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    env:
      # GUI tests run headlessly via the offscreen Qt platform plugin.
      QT_QPA_PLATFORM: offscreen

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      # System libraries needed by PySide6 (even with the offscreen plugin).
      - name: Install Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1

      - name: Install project (core, dev, and GUI extras)
        run: |
          python -m pip install --upgrade pip
          pip install ".[dev,gui]"

      - name: Run test suite (headless)
        run: python -m pytest -v

      - name: Verify package builds
        run: python -m build --outdir dist
