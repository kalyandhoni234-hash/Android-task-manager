name: CI

on:
  push:
  pull_request:

# Least-privilege baseline: CI only reads code and reports results. No job
# here publishes anything, so the GITHUB_TOKEN gets read-only access to the
# repository contents.
permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12"]

    env:
      # GUI tests run headlessly via the offscreen Qt platform plugin.
      QT_QPA_PLATFORM: offscreen

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout@v7.0.1

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      # System libraries needed by PySide6 (even with the offscreen plugin);
      # Linux-only — Windows wheels ship everything required.
      - name: Install Qt runtime libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1

      - name: Install project (core, dev, and GUI extras)
        run: |
          python -m pip install --upgrade pip
          pip install -c packaging/windows-build-constraints.txt ".[dev,gui]"

      - name: Run test suite (headless)
        run: python -m pytest -v

      - name: Verify package builds
        run: python -m build --outdir dist

  lint:
    name: Lint (Ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout@v7.0.1

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install lint tooling
        run: |
          python -m pip install --upgrade pip
          pip install ".[dev]"

      - name: Ruff check (src + tests)
        run: python -m ruff check src tests

  typecheck:
    name: Type check (Mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout@v7.0.1

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install type-check tooling
        run: |
          python -m pip install --upgrade pip
          pip install ".[dev]"

      # Enforced scope: the pure core (diagnostics), the ADB layer, the
      # device-information + diagnostics packages, the safe action layer and
      # the applications inventory — the surfaces covered by the device
      # intelligence and device-management work. The GUI layer's
      # pre-existing PySide6 typing debt is tracked separately (see
      # pyproject.toml).
      - name: Mypy (core + adb + device + diagnostics + action + applications + v0.8 intelligence core)
        run: |
          python -m mypy \
            src/android_task_manager/core \
            src/android_task_manager/adb \
            src/android_task_manager/device \
            src/android_task_manager/diagnostics \
            src/android_task_manager/action \
            src/android_task_manager/applications \
            src/android_task_manager/history \
            src/android_task_manager/health \
            src/android_task_manager/timeline \
            src/android_task_manager/rules \
            src/android_task_manager/recommend \
            src/android_task_manager/automation

  audit:
    name: Dependency audit (pip-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout@v7.0.1

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install project + audit tooling
        run: |
          python -m pip install --upgrade pip
          pip install -c packaging/windows-build-constraints.txt ".[dev,gui]"

      - name: Audit dependencies
        run: python -m pip_audit

  website:
    name: Website (lint + static build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-task-manager-website/website
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout@v7.0.1

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: android-task-manager-website/website/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Test release metadata
        run: npm test

      - name: Lint
        run: npm run lint

      - name: Build static export
        run: npm run build
