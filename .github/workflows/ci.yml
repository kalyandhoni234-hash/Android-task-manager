name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: Test (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12"]

    env:
      # GUI tests run headlessly via the offscreen Qt platform plugin.
      QT_QPA_PLATFORM: offscreen

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      # System libraries needed by PySide6 (even with the offscreen plugin);
      # Linux-only — Windows wheels ship everything required.
      - name: Install Qt runtime libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1

      - name: Install project (core, dev, and GUI extras)
        run: |
          python -m pip install --upgrade pip
          pip install ".[dev,gui]"

      - name: Run test suite (headless)
        run: python -m pytest -v

      - name: Verify package builds
        run: python -m build --outdir dist

  lint:
    name: Lint (Ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install lint tooling
        run: |
          python -m pip install --upgrade pip
          pip install ".[dev]"

      - name: Ruff check (src + tests)
        run: python -m ruff check src tests

  typecheck:
    name: Type check (Mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install type-check tooling
        run: |
          python -m pip install --upgrade pip
          pip install ".[dev]"

      # Enforced scope: the pure core (diagnostics) and the ADB layer —
      # the Phase-1 reliability surfaces. The GUI layer's pre-existing
      # PySide6 typing debt is tracked separately (see pyproject.toml).
      - name: Mypy (core + adb)
        run: |
          python -m mypy \
            src/android_task_manager/core \
            src/android_task_manager/adb

  audit:
    name: Dependency audit (pip-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install project + audit tooling
        run: |
          python -m pip install --upgrade pip
          pip install ".[dev,gui]"

      - name: Audit dependencies
        run: python -m pip_audit

  website:
    name: Website (lint + static build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-task-manager-website/website
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: android-task-manager-website/website/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Test release metadata
        run: npm test

      - name: Lint
        run: npm run lint

      - name: Build static export
        run: npm run build
