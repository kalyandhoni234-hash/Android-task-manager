name: Release (Windows EXE)

# Pushing a version tag (vX.Y.Z) builds the Windows executables in CI and
# publishes them to a GitHub Release:
#
#   git tag v0.2.0 && git push origin v0.2.0
#
# Artifacts: AndroidTaskManager.exe (the user-facing download),
# AndroidTaskManager-debug.exe (diagnostics), SHA256SUMS.txt.

on:
  push:
    tags: ["v*"]

# Read-only at the workflow level: neither the gate job nor artifact
# *building* needs to mutate the repository. Only the build-windows job,
# which publishes the GitHub Release, elevates to contents: write at its
# own job level.
permissions:
  contents: read

jobs:
  gate:
    name: Release gate (tests + version match)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # actions/checkout@v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      # System libraries needed by PySide6 (even with the offscreen plugin);
      # Linux-only — Windows wheels ship everything required. Mirrors the
      # test job in ci.yml so the release gate runs the identical suite.
      - name: Install Qt runtime libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1

      - name: Install project (core, dev, and GUI extras)
        run: |
          python -m pip install --upgrade pip
          pip install ".[dev,gui]"

      - name: Run test suite
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q

      - name: Ruff check (src + tests)
        run: python -m ruff check src tests

      - name: Mypy (core + adb + action + applications)
        run: |
          python -m mypy \
            src/android_task_manager/core \
            src/android_task_manager/adb \
            src/android_task_manager/action \
            src/android_task_manager/applications

      - name: Dependency audit (pip-audit)
        run: python -m pip_audit

      # A release tag must match the package version exactly; a mismatched
      # tag (or a stale version bump) fails the workflow before any artifact
      # is built or published.
      - name: Assert tag version matches package version
        run: |
          VERSION="$(python -c 'import android_task_manager; print(android_task_manager.__version__)')"
          TAG="${GITHUB_REF_NAME#v}"
          if [ -z "${TAG}" ]; then
            echo "::error::No version tag on this ref (${GITHUB_REF_NAME})."
            exit 1
          fi
          if [ "${VERSION}" != "${TAG}" ]; then
            echo "::error::Package version ${VERSION} does not match tag v${TAG}."
            exit 1
          fi
          echo "Package version ${VERSION} matches tag v${TAG}"

  build-windows:
    name: Build Windows executables
    runs-on: windows-latest
    needs: gate

    # The only job that publishes: creating the GitHub Release and uploading
    # the EXE/checksum/provenance artifacts. contents: write covers release
    # creation; id-token + attestations: write enable GitHub build provenance
    # via short-lived OIDC (no stored signing secrets). Scoped here so the
    # read-only gate job (and any future job) never holds them.
    permissions:
      contents: write
      id-token: write
      attestations: write

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # actions/checkout@v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Build executables (windowed + debug)
        shell: powershell
        run: powershell -ExecutionPolicy Bypass -File packaging\build_windows.ps1

      - name: Generate SHA-256 checksums
        shell: powershell
        run: |
          $lines = foreach ($f in @("dist\AndroidTaskManager.exe", "dist\AndroidTaskManager-debug.exe")) {
            $hash = (Get-FileHash $f -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $f"
          }
          Set-Content -Path dist\SHA256SUMS.txt -Value $lines
          Get-Content dist\SHA256SUMS.txt

      # Signed build provenance (SLSA) for every release subject, generated
      # with a short-lived OIDC token. Verifiable after download with:
      #   gh attestation verify <file> -R <owner>/<repo>
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # actions/attest-build-provenance@v4.2.2
        with:
          subject-path: |
            dist/AndroidTaskManager.exe
            dist/AndroidTaskManager-debug.exe
            dist/SHA256SUMS.txt
            dist/BUILD_ENV_FREEZE.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # softprops/action-gh-release@v2
        with:
          files: |
            dist/AndroidTaskManager.exe
            dist/AndroidTaskManager-debug.exe
            dist/SHA256SUMS.txt
            dist/BUILD_ENV_FREEZE.txt
          generate_release_notes: true