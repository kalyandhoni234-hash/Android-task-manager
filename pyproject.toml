[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "android-task-manager"
# The single authoritative version source is
# src/android_task_manager/__init__.py (__version__); the package version,
# the Windows EXE version resource and release tags all derive from it.
dynamic = ["version"]
description = "Terminal-based Android Task Manager / System Monitor that talks to a device over ADB."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Android Task Manager project" }]
classifiers = [
    "Environment :: Console",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Monitoring",
]
dependencies = []

[project.optional-dependencies]
# Test/build tooling: pytest for the suite, build for wheel/sdist creation,
# pyinstaller for the standalone Windows executables (packaging/build_windows.ps1),
# ruff for linting, mypy for type checking, pip-audit for dependency auditing.
dev = [
    "pytest>=7.0",
    "build>=1.0",
    "pyinstaller>=6.0",
    "ruff>=0.9",
    "mypy>=1.13",
    "pip-audit>=2.9",
]
# PySide6: the single GUI dependency (Qt for Python). It powers the desktop
# dashboard only; the terminal mode does not need it. Install with:
#   pip install -e ".[gui]"
gui = ["PySide6>=6.5"]

[project.scripts]
android-task-manager = "android_task_manager.main:main"
android-task-manager-gui = "android_task_manager.gui.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = { attr = "android_task_manager.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
# Pragmatic lint baseline for the whole tree: pyflakes (F), fatal/statement
# pycodestyle errors (E4/E7/E9), import sorting (I) and bugbear (B). The
# codebase's intentional broad `except Exception` handlers are annotated
# with `# noqa: BLE001` so bugbear can actually enforce them.
line-length = 100
target-version = "py310"
extend-exclude = ["android-task-manager-website"]
lint.select = ["E4", "E7", "E9", "F", "I", "B"]

[tool.mypy]
# Type-checking scope: the pure core + ADB layer are enforced in CI
# (src/android_task_manager/core, src/android_task_manager/adb). The GUI
# layer carries pre-existing PySide6 typing debt that is tracked for later
# phases; new code in enforced paths must stay clean.
python_version = "3.10"
ignore_missing_imports = true
warn_unused_ignores = false
check_untyped_defs = false